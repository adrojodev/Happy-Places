# Upload the App Store screenshots in AppStore/screenshots/<locale>/ to the
# current editable version using fastlane deliver. Replaces ALL existing
# screenshots (overwrite) — the repo folder is the source of truth.
# Uses the same ASC_* secrets as release.yml; screenshot upload needs no
# signing permissions, so an App Manager key is enough.

name: Upload App Store screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          json.dump({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_KEY_P8"],
              "in_house": False,
          }, open("asc_key.json", "w"))
          EOF

      - name: Upload screenshots
        run: |
          fastlane deliver \
            --api_key_path asc_key.json \
            --app_identifier "rojo.happy-places-moments" \
            --screenshots_path "AppStore/screenshots" \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_app_version_update true \
            --overwrite_screenshots true \
            --run_precheck_before_submit false \
            --force true
